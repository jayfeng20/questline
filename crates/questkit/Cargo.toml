[package]
name = "questkit"
description = "The questline quest contract: manifests, progress files, and the lesson runner every quest module uses"
# Spelled out rather than inherited: every quest workspace depends on this crate by path, and
# must be able to load it without this repository's workspace.
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jayfeng20/questline"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
